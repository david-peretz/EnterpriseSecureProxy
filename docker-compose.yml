services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: secureproxy-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ChangeMe_Str0ng!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - secureproxy-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'ChangeMe_Str0ng!' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  secureproxy-sql-data:
